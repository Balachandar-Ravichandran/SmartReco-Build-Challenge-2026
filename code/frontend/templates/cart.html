<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Pathwise</title>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
  {% import "_macros.html" as m %}
  <div class="themetoggle floating" onclick="toggleTheme()"><span id="themeicon">&#127769;</span> <span id="themelabel">Dark mode</span></div>

  {% set nav_active = '' %}
  {% include "_nav_app.html" %}

  <div class="home-body">
    <div>
      <div class="greeting">Your cart</div>
      <div class="greeting-sub" style="margin-bottom:22px;">Cosmetic only for now — nothing here is a real order, and nothing is charged.</div>

      <div id="cart-items" class="cartlist"></div>

      <div class="cartfooter">
        <span>Total</span>
        <span id="cart-total">$0</span>
      </div>

      <div id="cart-companions-wrap" class="cartcompanions" style="display:none;">
        <div id="cart-companions"></div>
      </div>
    </div>

    <div class="sidebarcol">
      {{ m.signal_panel('signalpanel-cart', ticker, scores, reason) }}
    </div>
  </div>

  <div class="toast" id="toast">Added to cart</div>
  <script src="/static/app.js"></script>
  <script>
    window.PATHWISE_USER_ID = "{{ user_id }}";
  </script>
</body>
</html>
